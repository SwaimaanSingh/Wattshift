<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16a34a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Installable web app -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS ignores the manifest, so the same details are repeated here.
         Status bar stays `default` rather than `black-translucent`: the app
         only pads the bottom safe area, so a translucent bar would run the
         header under the clock on a notched iPhone. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WattShift" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>WattShift — Free Solar Calculator for Australian Homes &amp; Businesses</title>
    <meta
      name="description"
      content="Upload your electricity bill and see exactly what solar could save you. Free, private, no signup. Built by Australian engineers."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="WattShift — See what solar could save you" />
    <meta
      property="og:description"
      content="Upload your bill for a free, personalised solar estimate"
    />
    <meta property="og:image" content="/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WattShift — See what solar could save you" />
    <meta
      name="twitter:description"
      content="Upload your bill for a free, personalised solar estimate"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
